name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      # The brute-force comparisons do many draws on small matrices, where
      # multi-threaded BLAS costs far more time synchronizing than it saves.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Prometheus depends on enterprise-pulsar, which pins scikit-sparse.
      # scikit-sparse publishes no wheels at all, so pip builds it from its
      # sdist against SuiteSparse, which a bare runner does not carry.
      - run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev

      - run: pip install -e '.[test]'

      # test_ng15 skips itself: the 2 GB NG15 pickle is not on the runner.
      - run: pytest -m "not slow" -q
