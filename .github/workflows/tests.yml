name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The array-level core, on numpy and scipy alone -- which is most of
    # pta_sims. test_sampling skips itself without numpyro, and test_ng15
    # without Prometheus and the NG15 pickle.
    runs-on: ubuntu-latest
    env:
      # The brute-force comparisons do many draws on small matrices, where
      # multi-threaded BLAS costs far more than it saves.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest -m "not slow" -q

  sampling:
    # Adds numpyro so the NUTS watchdog tests run too. Prometheus and the
    # 2 GB NG15 pickle are not available on a runner, so test_ng15 still skips.
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[test]' jax numpyro
      - run: pytest -m "not slow" -q
